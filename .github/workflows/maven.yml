name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"
          cache: maven

      - name: Capture JDK 8 home
        run: |
          echo "JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Capture JDK 17 home
        run: |
          echo "JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Ensure Maven is available
        run: |
          mvn -v

      - name: Provide mvnw shim (repo does not include Maven Wrapper)
        shell: bash
        run: |
          if [ ! -f "./mvnw" ]; then
            cat > ./mvnw <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec mvn "$@"
          EOF
            chmod +x ./mvnw
          fi

      - name: Build
        env:
          ADDITIONAL_MVN_OPTS: "--no-transfer-progress"
          SCALA_IDE_COMPILE_CLASSPATH: "${{ env.JAVA8_HOME }}/jre/lib/rt.jar:${{ env.JAVA8_HOME }}/lib/tools.jar"
        run: ./build-all.sh
